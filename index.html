<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Swish</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d0e13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Swish">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="swish-icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="swish-icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app"></main>
  <div id="toast" role="status"></div>
  <script type="module" src="js/app.js" onerror="swishFailed()"></script>
  <script>
    // Shown only if the app code never starts (a failed or half-finished download).
    function swishFailed() {
      if (window.__swishBooted || document.getElementById('boot-fail')) return;
      var d = document.createElement('div'); d.id = 'boot-fail'; d.className = 'screen';
      d.innerHTML = '<h1>Swish could not start</h1><p>Part of the app did not download. Check your connection and try again.</p><button class="btn" onclick="location.reload()">Reload</button>';
      document.getElementById('app').replaceChildren(d);
    }
    window.addEventListener('error', function (e) { if (e.target && e.target.tagName === 'SCRIPT') swishFailed(); }, true);
    setTimeout(swishFailed, 12000);
  </script>
</body>
</html>
